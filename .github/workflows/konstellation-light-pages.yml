name: Konstellation Light — opt-in public Pages

# Intentionally manual. Until the C3 qualification+authorization receipt is integrated,
# only the original explicitly public demo may be deployed.
on:
  workflow_dispatch:
    inputs:
      collection_directory:
        description: 'Optional: repository-relative PUBLIC verified Kristal v10 collection path, containing kristals/index.json. Empty = bundled public demo.'
        required: false
        type: string
        default: ''
      revision:
        description: 'Revision label (immutable for a given export)'
        required: false
        type: string
        default: 'public'

permissions:
  contents: read

concurrency:
  group: konstellation-light-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Validate light exporter
        run: node --test tests/kristal-v10.test.mjs tests/light.test.mjs
      - name: Reject real collection deployment until trusted C3 gate is integrated
        if: ${{ inputs.collection_directory != '' }}
        run: |
          echo 'C4 safety gate: publication de collections réelles désactivée sans preuve C3 acceptée.' >&2
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: light/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
