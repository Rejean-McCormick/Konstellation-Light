name: Konstellation Light - 126 publics - beta explicite

# Parcours public *distinct* du workflow de publication qualifiée C1-C4.
# Le propriétaire a explicitement choisi d'exposer via un lecteur les surfaces
# qui sont DÉJÀ publiques dans Rejean-McCormick/kristal-public.
# Aucun reçu de qualification, approbation éditoriale ou signature inventé.
# Ne jamais y substituer des sources privées, locales ou candidates.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tapez PUBLIER_126 pour publier la bêta des 126 Kristals déjà publics'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: konstellation-light-pages
  cancel-in-progress: false

jobs:
  build-public-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Confirmer la décision explicite du propriétaire
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'PUBLIER_126' ]; then
            echo 'Publication annulée : confirmation exacte requise.' >&2
            exit 1
          fi
      - name: Charger le code sans conserver de jeton
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester la garde minimale de la bêta
        run: node --test tests/public-beta-126.test.mjs tests/ml-six-languages.test.mjs tests/ml-v22-ui.test.mjs tests/multilingual-read.test.mjs
      - name: Résoudre le commit exact déjà public
        id: pin
        run: |
          node scripts/resoudre-pin-kristals-126.mjs \
            --report "$RUNNER_TEMP/source-pin.json" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Importer uniquement la collection publique épinglée
        env:
          SOURCE_COMMIT: ${{ steps.pin.outputs.commit }}
          INDEX_DIGEST: ${{ steps.pin.outputs.index_digest }}
        run: |
          node scripts/import-pinned-collection.mjs \
            --repository Rejean-McCormick/kristal-public \
            --commit "$SOURCE_COMMIT" \
            --expected-index-digest "$INDEX_DIGEST" \
            --out "$RUNNER_TEMP/public-kristals"
      - name: Construire le lecteur existant sans traductions candidates
        run: |
          node scripts/preparer-site-web-126.mjs \
            --collection "$RUNNER_TEMP/public-kristals" \
            --out "$RUNNER_TEMP/konstellation-light-public-beta-126" \
            --expected-count 126
      - name: Vérifier l'intégrité et constater le C4 historique toujours bloqué
        run: |
          set +e
          node scripts/c4-publication-gate.mjs --site "$RUNNER_TEMP/konstellation-light-public-beta-126"
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo 'Intégrité inattendue, ou démonstration épinglée confondue avec la collection réelle.' >&2
            exit 1
          fi
      - name: Apposer une mention de bêta non qualifiée visible
        run: |
          node scripts/estampiller-beta-publique-126.mjs \
            --site "$RUNNER_TEMP/konstellation-light-public-beta-126" \
            --source-report "$RUNNER_TEMP/source-pin.json"
      - name: Contrôler à nouveau les fichiers après estampillage
        run: |
          set +e
          node scripts/c4-publication-gate.mjs --site "$RUNNER_TEMP/konstellation-light-public-beta-126"
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then echo 'Intégrité échouée après estampillage' >&2; exit 1; fi
          test -s "$RUNNER_TEMP/konstellation-light-public-beta-126/index.html"
      - name: Servir rapidement le HTML et le catalogue en HTTP local
        run: |
          python3 -m http.server 47821 --bind 127.0.0.1 --directory "$RUNNER_TEMP/konstellation-light-public-beta-126" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:47821/ -o /tmp/konstellation-test-index.html; then break; fi
            sleep 1
          done
          grep -q 'konstellation-public-beta-disclosure' /tmp/konstellation-test-index.html
          curl --silent --fail http://127.0.0.1:47821/data/catalog.json -o /tmp/konstellation-test-catalog.json
          node --input-type=module -e 'import fs from "node:fs";const c=JSON.parse(fs.readFileSync("/tmp/konstellation-test-catalog.json","utf8"));if(c.entries.length!==126)process.exit(1);'
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger l'artefact du lecteur public (pas les archives privées)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/konstellation-light-public-beta-126
      - name: Résumé transparent du périmètre
        run: |
          {
            echo '### Konstellation-Light : bêta publique'
            echo '- 126 Kristals déjà publics, prélevés à un seul commit de kristal-public.'
            echo '- Démonstration C4 historique et chaîne C1-C4 indépendante inchangées.'
            echo '- **Aucune qualification C1/C2/C3/C4 prétendue.**'
            echo '- Traductions candidates et fichiers privés exclus.'
            echo '- Cette mise en ligne est une bêta explicitement confirmée par le propriétaire.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-public-beta:
    needs: build-public-beta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Déployer la bêta publique HTTPS
        id: deploy
        uses: actions/deploy-pages@v4
